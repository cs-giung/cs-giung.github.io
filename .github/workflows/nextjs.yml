name: Validate and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Restore production build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'data/**', 'assets/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-
      - name: Install locked dependencies
        run: npm ci
      - name: Check code, documentation, types, and unit tests
        run: npm run check
      - name: Build static export
        run: npm run build
      - name: Verify exported pages and contact obfuscation
        run: npm run test:export
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test interactions, responsive layout, and printing
        run: npm run test:browser
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: gh-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
